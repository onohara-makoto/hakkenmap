name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck · Lint · Unit tests · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ビルドとデモの E2E は Supabase・Gemini に接続しない。ダミー値で足りる
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  rls:
    name: RLS access-isolation (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # supabase/config.toml の設定で空のローカル Supabase（Docker）を起動し、
      # supabase/migrations を適用してから RLS テストを流す。本番プロジェクトには接続しない
      - run: supabase db start
      - name: Run RLS tests
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql 2>&1 | tee rls.log
          grep -q "RLS OK" rls.log
